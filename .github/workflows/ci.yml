name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the release floor the jar is compiled against; 25 is what Vis runs.
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdeps-

      - name: Compile the Java engine
        run: clojure -T:build compile-java

      # The differential suite runs the REAL parinferish 0.8.0 against this
      # rewrite over every source in the repo and 400 seeded mutations of them.
      - name: Test
        run: clojure -X:test

      - name: Build the jar
        run: clojure -T:build jar
